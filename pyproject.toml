[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chancedetect"
version = "0.1.0"
description = "On-exchange ETF/LOF strategy scanner with strict off-exchange fund mapping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.18.0",
    "duckdb>=1.1.3",
    "pyarrow>=18.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.4",
    "typer>=0.14.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
chancedetect = "chancedetect.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/chancedetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
